<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Puzzle | MindBridge</title>
<link rel="stylesheet" href="kit.css">
<style>
  .facts{
    background:var(--surface-2);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;margin:0 auto 16px;max-width:520px;
  }
  .facts ol{margin:0;padding-left:22px}
  .facts li{font-size:19px;line-height:1.6;margin:0 0 6px}
  .facts li:last-child{margin:0}
  .question{
    font-family:var(--serif);font-size:23px;font-weight:600;text-align:center;
    margin:0 0 16px;color:var(--teal-800);
  }
  .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;max-width:460px;margin:0 auto}
  .opt{
    min-height:64px;padding:14px;border-radius:14px;cursor:pointer;
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    font-family:var(--sans);font-size:20px;font-weight:600;
  }
  .opt:active{transform:scale(.97)}
  .opt.correct{border-color:var(--green-500);background:var(--green-100)}
  .opt.wrong{border-color:var(--red-600);background:var(--red-100)}
  .working{
    font-size:16px;color:var(--ink-soft);text-align:center;
    margin:14px auto 0;max-width:520px;line-height:1.5;
  }
</style>
</head>
<body>
<script src="kit.js"></script>
<script>
(function () {
  "use strict";

  var g = MBGame.init({
    id: "logic-puzzle",
    name: "Logic Puzzle",
    difficulty: "hard",
    maxRaw: 100,
    howTo: "Read the facts carefully, then answer the question. Every answer " +
           "can be worked out from the facts alone — nothing is guesswork.",
    example: "If Anna is taller than Ben, and Ben is taller than Carl, then Carl is the shortest.",
    voiceLine: "Read the facts, then choose the answer.",
  });

  /* ---------------------------------------------------------- parameters */
  /* Chain length: how many linked facts must be held at once. */
  var chain  = g.clamp(3 + Math.floor((g.level - 1) / 2) + g.boost, 3, 5);
  var ROUNDS = 4;

  var NAMES = ["Anna", "Ben", "Carl", "Dina", "Eli", "Farah", "Gita", "Hari"];

  var FRAMES = [
    { compare: "taller than", most: "tallest",  least: "shortest" },
    { compare: "older than",  most: "oldest",   least: "youngest" },
    { compare: "faster than", most: "fastest",  least: "slowest" },
    { compare: "heavier than",most: "heaviest", least: "lightest" }
  ];

  var round = 0, correct = 0, raw = 0, locked = false;

  /* Build a strict ordering, then state it as scrambled pairwise facts. */
  function makePuzzle() {
    var frame = g.pick(FRAMES);
    var people = g.sample(NAMES, chain);   /* people[0] is the greatest */

    var facts = [];
    for (var i = 0; i < people.length - 1; i++) {
      facts.push(people[i] + " is " + frame.compare + " " + people[i + 1] + ".");
    }
    facts = g.shuffle(facts);

    var askLeast = Math.random() < 0.5;
    var question = askLeast
      ? "Who is the " + frame.least + "?"
      : "Who is the " + frame.most + "?";
    var answer = askLeast ? people[people.length - 1] : people[0];

    var working = askLeast
      ? "Nobody is " + frame.compare + " " + answer + " in reverse — " + answer +
        " sits at the bottom of the chain."
      : answer + " is " + frame.compare + " everyone else, directly or through the chain.";

    return {
      facts: facts,
      question: question,
      answer: answer,
      options: g.shuffle(people.slice(0, 4).indexOf(answer) === -1
        ? people.slice(0, 3).concat([answer])
        : people.slice(0, 4)),
      working: working,
      order: people
    };
  }

  function build() {
    g.stage.innerHTML = "";
    g.stage.appendChild(Object.assign(g.el("div", "facts"), { id: "facts" }));
    g.stage.appendChild(Object.assign(g.el("p", "question", ""), { id: "question" }));
    g.stage.appendChild(Object.assign(g.el("div", "opts"), { id: "opts" }));
    g.stage.appendChild(Object.assign(g.el("p", "working", ""), { id: "working" }));
  }

  function nextRound() {
    if (round >= ROUNDS) return endGame();
    round++;
    locked = false;
    g.setProgress("Puzzle " + round + " of " + ROUNDS);
    g.flash("");
    document.getElementById("working").textContent = "";

    var p = makePuzzle();

    var box = document.getElementById("facts");
    box.innerHTML = "";
    var ol = g.el("ol");
    p.facts.forEach(function (f) { ol.appendChild(g.el("li", null, f)); });
    box.appendChild(ol);

    document.getElementById("question").textContent = p.question;

    var opts = document.getElementById("opts");
    opts.innerHTML = "";
    p.options.forEach(function (name) {
      var b = g.el("button", "opt", name);
      b.type = "button";
      b.addEventListener("click", function () { choose(b, name, p); });
      opts.appendChild(b);
    });

    g.say(p.facts.join(" ") + " " + p.question);
  }

  function choose(btn, name, p) {
    if (locked) return;
    locked = true;

    if (name === p.answer) {
      correct++;
      raw += 25;                         /* 4 puzzles x 25 = 100 */
      g.addPoints(25);
      btn.classList.add("correct");
      g.flash("Correct — well reasoned", "ok");
      g.say("Correct.");
    } else {
      btn.classList.add("wrong");
      Array.prototype.forEach.call(document.getElementById("opts").children,
        function (b) { if (b.textContent === p.answer) b.classList.add("correct"); });
      g.flash("The answer was " + p.answer, "no");
      g.say("The answer was " + p.answer);
    }

    /* Always show the reasoning, win or lose — that is the training value. */
    document.getElementById("working").textContent =
      "In order: " + p.order.join(" → ") + ". " + p.working;

    setTimeout(nextRound, 3200);
  }

  function endGame() {
    var accuracy = Math.round((correct / ROUNDS) * 100);
    g.finish({
      raw: raw,
      accuracy: accuracy,
      metrics: {
        puzzles_solved: correct,
        puzzles_total: ROUNDS,
        chain_length: chain
      },
      tooEasy: accuracy === 100,
      tooHard: accuracy < 50,
      verdict: accuracy === 100 ? "Flawless reasoning!" :
               accuracy >= 80 ? "Clear thinking!" : "Good effort"
    });
  }

  g.intro(function () {
    build();
    nextRound();
  });
})();
</script>
</body>
</html>
