<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | MindBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <section class="auth-card">

      <div class="brand">
        <div class="mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
          </svg>
        </div>
        <div>
          <h1>MindBridge</h1>
          <p>Cognitive Care Companion</p>
        </div>
      </div>

      <h2>Welcome back</h2>
      <p class="auth-copy">Sign in with the caretaker's mobile number to continue to the cognitive care dashboard.</p>

      <form class="auth-form" id="signInForm" novalidate>
        <label>
          Caretaker's mobile number
          <span class="mobile-input">
            <span class="prefix">+91</span>
            <input id="mobile" type="tel" inputmode="numeric" autocomplete="username"
                   maxlength="15" placeholder="98765 43210" required>
          </span>
          <span class="field-hint">Use the number you used when creating your account.</span>
        </label>

        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <p class="auth-error" id="formMessage" role="alert"></p>

        <button class="btn full" id="submitBtn" type="submit">Sign in</button>
      </form>

      <p class="auth-switch">New to MindBridge? <a href="create-account.html">Create an account</a></p>

    </section>
  </main>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
