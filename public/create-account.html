<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | MindBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="auth-page">

  <main class="auth-shell">
    <section class="auth-card">

      <div class="brand">
        <div class="mark">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
          </svg>
        </div>
        <div>
          <h1>MindBridge</h1>
          <p>Cognitive Care Companion</p>
        </div>
      </div>

      <h2>Create your account</h2>
      <p class="auth-copy">One account holds the caretaker and the patient they look after. It takes a minute.</p>

      <form class="auth-form" id="signUpForm" novalidate>

        <label>
          Caretaker's name
          <input id="caretakerName" autocomplete="name" placeholder="e.g. Ratan Singh" required>
        </label>

        <label>
          Patient's name
          <input id="patientName" placeholder="e.g. Mema Singh" required>
        </label>

        <label>
          Caretaker's mobile number
          <span class="mobile-input">
            <span class="prefix">+91</span>
            <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel"
                   maxlength="15" placeholder="98765 43210" required>
          </span>
          <span class="field-hint">This number is how you sign in.</span>
        </label>

        <label>
          Preferred language
          <select id="languageCode" required>
            <option value="en">English</option>
            <option value="hi">हिन्दी — Hindi</option>
            <option value="as">অসমীয়া — Assamese</option>
            <option value="mni">ꯃꯤꯇꯩꯂꯣꯟ — Manipuri (Meitei)</option>
            <option value="bn">বাংলা — Bengali</option>
            <option value="ne">नेपाली — Nepali</option>
            <option value="kha">Ka Ktien Khasi — Khasi</option>
            <option value="lus">Mizo ṭawng — Mizo</option>
            <option value="brx">बर' — Bodo</option>
            <option value="nag">Nagamese</option>
          </select>
          <span class="field-hint">Sets the dashboard text and the voice narration.</span>
        </label>

        <div class="field-row">
          <label>
            <span>Patient's age <span class="field-hint">— optional</span></span>
            <input id="age" type="number" min="40" max="120" inputmode="numeric" placeholder="72">
          </label>
          <label>
            <span>Town / district <span class="field-hint">— optional</span></span>
            <input id="region" placeholder="Imphal, Manipur">
          </label>
        </div>

        <label>
          Password
          <input id="password" type="password" minlength="6" maxlength="128" pattern=".{6,}" title="Password must be at least 6 characters" autocomplete="new-password" required>
          <span class="field-hint">At least 6 characters.</span>
        </label>

        <label>
          Confirm password
          <input id="confirmPassword" type="password" minlength="6" maxlength="128" pattern=".{6,}" title="Password must be at least 6 characters" autocomplete="new-password" required>
        </label>

        <p class="auth-error" id="formMessage" role="alert"></p>

        <button class="btn full" id="submitBtn" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>

    </section>
  </main>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
