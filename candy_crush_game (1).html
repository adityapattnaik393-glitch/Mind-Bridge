<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Crush - Match 3</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at top left,#ffd6ec,transparent 35%),radial-gradient(circle at bottom right,#d8d7ff,transparent 35%),linear-gradient(135deg,#fff0f8,#eeeaff);display:flex;justify-content:center;align-items:center;color:#3c2940;padding:20px}
.game-container{width:100%;max-width:650px}.header{text-align:center;margin-bottom:20px}
.title{font-size:clamp(32px,7vw,52px);font-weight:900;background:linear-gradient(90deg,#ff4f81,#ff9b3d,#a85cff,#43bfff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-2px}
.subtitle{margin-top:5px;color:#806b85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}
.stat-box{background:rgba(255,255,255,.8);backdrop-filter:blur(10px);border:1px solid #ead9e7;border-radius:16px;padding:12px;text-align:center;box-shadow:0 5px 15px rgba(80,40,80,.08)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#8c788f}.stat-value{display:block;font-size:25px;font-weight:900;margin-top:3px}
.board-container{position:relative;background:rgba(255,255,255,.75);padding:10px;border-radius:25px;border:1px solid #ead9e7;box-shadow:0 20px 50px rgba(100,60,100,.15),inset 0 1px rgba(255,255,255,.8)}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:7px;background:#ead9e7;border-radius:18px;touch-action:none;user-select:none}
.candy{border:none;width:100%;aspect-ratio:1;border-radius:14px;cursor:pointer;display:flex;justify-content:center;align-items:center;font-size:clamp(20px,6vw,38px);position:relative;transition:transform .12s ease,filter .12s ease,opacity .15s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),inset 0 3px 6px rgba(255,255,255,.65)}
.candy:hover{filter:brightness(1.08)}.candy:active{transform:scale(.92)}
.red{background:linear-gradient(145deg,#ff7891,#ff3f69)}.orange{background:linear-gradient(145deg,#ffd36b,#ff9e20)}.blue{background:linear-gradient(145deg,#79dcff,#39aef0)}.green{background:linear-gradient(145deg,#94e875,#4cc85a)}.purple{background:linear-gradient(145deg,#c294ff,#8956e8)}.pink{background:linear-gradient(145deg,#ff9bd6,#ed5cb0)}
.candy.selected{transform:scale(.86);outline:4px solid #d946a8;outline-offset:2px;filter:brightness(1.15);z-index:3}
.candy.special{box-shadow:inset 0 -5px 0 rgba(0,0,0,.16),inset 0 3px 6px rgba(255,255,255,.7),0 0 0 3px rgba(255,255,255,.7)}
.candy.matched{animation:candyPop .25s ease forwards}
@keyframes candyPop{0%{transform:scale(1)}50%{transform:scale(1.25);filter:brightness(1.4)}100%{transform:scale(.1);opacity:0}}
.progress-container{height:9px;margin-top:15px;background:#ead9e7;border-radius:100px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#ff4f81,#a85cff);border-radius:inherit;transition:width .3s ease}
.message{min-height:25px;text-align:center;margin-top:10px;font-size:14px;color:#806b85;font-weight:700}
.controls{display:flex;justify-content:center;gap:10px;margin-top:12px}.control-button{min-height:45px;padding:10px 18px;border-radius:13px;border:1px solid #ead9e7;background:white;color:#3c2940;font-weight:800;cursor:pointer;transition:.15s ease}
.control-button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(80,40,80,.12)}.restart-button{color:white;border-color:#d946a8;background:linear-gradient(135deg,#e64aa9,#b951e8)}
.help{text-align:center;margin-top:12px;font-size:11px;color:#907d93;line-height:1.5}
.overlay{position:absolute;inset:10px;background:rgba(255,247,251,.94);border-radius:18px;display:none;justify-content:center;align-items:center;text-align:center;z-index:10}.overlay.show{display:flex}
.game-over-card{background:white;border:1px solid #ead9e7;border-radius:22px;padding:30px;width:min(90%,330px);box-shadow:0 20px 50px rgba(80,40,80,.15)}
.game-over-card h2{font-size:30px;margin-bottom:8px}.game-over-card p{color:#806b85;margin-bottom:20px}
@media(max-width:450px){body{padding:10px}.board-container{padding:7px;border-radius:20px}.board{gap:4px;padding:5px;border-radius:15px}.candy{border-radius:9px}.stats{gap:6px}.stat-box{padding:9px}.stat-value{font-size:21px}.controls{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.candy{transition:none}.candy.matched{animation:none;opacity:.2}}
</style>
</head>
<body>
<div class="game-container">
<div class="header"><div class="title">🍬 Candy Crush</div><div class="subtitle">Match 3 or more candies to score points!</div></div>
<div class="stats">
<div class="stat-box"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
<div class="stat-box"><span class="stat-label">Moves</span><span class="stat-value" id="moves">30</span></div>
<div class="stat-box"><span class="stat-label">Level</span><span class="stat-value" id="level">1</span></div>
</div>
<div class="board-container">
<div class="board" id="board" aria-label="Candy game board"></div>
<div class="overlay" id="overlay"><div class="game-over-card"><h2 id="gameOverTitle">🍭 Game Over</h2><p id="gameOverText">Nice run!</p><button class="control-button restart-button" id="overlayRestart" type="button">Play Again</button></div></div>
</div>
<div class="progress-container"><div class="progress" id="progress"></div></div>
<div class="message" id="message" aria-live="polite">Swap two adjacent candies to start!</div>
<div class="controls"><button type="button" class="control-button restart-button" id="restart">↻ Restart</button><button type="button" class="control-button" id="shuffle">🔀 Shuffle</button></div>
<div class="help">🖱️ Click two adjacent candies to swap them<br>📱 On mobile, tap or swipe between candies<br>⚡ Match 4 for a striped candy • 🌈 Match 5 for a color bomb</div>
</div>
<script>
(()=> {
const ROWS=8,COLS=8,TOTAL_CANDY_TYPES=6,STARTING_MOVES=30;
const CANDY_ICONS=["🍓","🍊","🫐","🍏","🍇","🍬"];
const CANDY_CLASSES=["red","orange","blue","green","purple","pink"];
let board=[],selectedCell=null,score=0,moves=STARTING_MOVES,level=1,busy=false,dragStart=null;
const boardElement=document.getElementById("board"),scoreElement=document.getElementById("score"),movesElement=document.getElementById("moves"),levelElement=document.getElementById("level"),progressElement=document.getElementById("progress"),messageElement=document.getElementById("message"),overlay=document.getElementById("overlay"),gameOverTitle=document.getElementById("gameOverTitle"),gameOverText=document.getElementById("gameOverText");
function randomCandyType(){return Math.floor(Math.random()*TOTAL_CANDY_TYPES)}
function getIndex(row,col){return row*COLS+col}
function getCoordinates(index){return[Math.floor(index/COLS),index%COLS]}
function createCandy(type){return{type,special:null}}
function createBoard(){
 board=[];
 for(let row=0;row<ROWS;row++)for(let col=0;col<COLS;col++){
  let candy;
  do{candy=createCandy(randomCandyType())}
  while((col>=2&&board[getIndex(row,col-1)].type===candy.type&&board[getIndex(row,col-2)].type===candy.type)||(row>=2&&board[getIndex(row-1,col)].type===candy.type&&board[getIndex(row-2,col)].type===candy.type));
  board.push(candy);
 }
}
function renderBoard(){
 boardElement.innerHTML="";
 board.forEach((candy,index)=>{
  const button=document.createElement("button");button.type="button";button.classList.add("candy",CANDY_CLASSES[candy.type]);
  if(selectedCell===index)button.classList.add("selected");
  if(candy.special)button.classList.add("special");
  if(candy.special==="bomb")button.textContent="🌈";
  else if(candy.special==="horizontal")button.textContent="⚡";
  else if(candy.special==="vertical")button.textContent="↕️";
  else button.textContent=CANDY_ICONS[candy.type];
  button.setAttribute("aria-label",`Candy ${candy.type+1}`);
  button.addEventListener("click",()=>handleCellClick(index));
  boardElement.appendChild(button);
 });
 updateStats();
}
function updateStats(){
 scoreElement.textContent=score;movesElement.textContent=moves;levelElement.textContent=level;
 progressElement.style.width=`${Math.min(100,(score/(level*1000))*100)}%`;
}
function handleCellClick(index){
 if(busy||moves<=0)return;
 if(selectedCell===null){selectedCell=index;renderBoard();return}
 if(selectedCell===index){selectedCell=null;renderBoard();return}
 const [r1,c1]=getCoordinates(selectedCell),[r2,c2]=getCoordinates(index);
 if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1){selectedCell=index;renderBoard();return}
 const first=selectedCell;selectedCell=null;performSwap(first,index);
}
function swapCandies(a,b){const temp=board[a];board[a]=board[b];board[b]=temp}
function performSwap(first,second){
 if(busy)return;busy=true;swapCandies(first,second);moves--;renderBoard();
 setTimeout(()=>{
  const matches=findMatches();
  if(matches.size===0){
   swapCandies(first,second);moves++;messageElement.textContent="❌ No match! Try another swap!";renderBoard();busy=false;return;
  }
  processMatches(matches);
 },150);
}
function findMatches(){
 const matches=new Set();
 for(let row=0;row<ROWS;row++){
  let col=0;
  while(col<COLS){
   const current=board[getIndex(row,col)];let end=col+1;
   while(end<COLS&&board[getIndex(row,end)].type===current.type)end++;
   if(end-col>=3)for(let c=col;c<end;c++)matches.add(getIndex(row,c));
   col=end;
  }
 }
 for(let col=0;col<COLS;col++){
  let row=0;
  while(row<ROWS){
   const current=board[getIndex(row,col)];let end=row+1;
   while(end<ROWS&&board[getIndex(end,col)].type===current.type)end++;
   if(end-row>=3)for(let r=row;r<end;r++)matches.add(getIndex(r,col));
   row=end;
  }
 }
 return matches;
}
function processMatches(matches){
 const matchCount=matches.size,points=matchCount*60*level;score+=points;messageElement.textContent=`✨ +${points} points!`;
 const matchArray=[...matches];
 if(matchCount>=5){const i=matchArray[0];board[i]={type:randomCandyType(),special:"bomb"};matches.delete(i)}
 else if(matchCount===4){
  const i=matchArray[0],[row1,col1]=getCoordinates(i);let specialType="horizontal";
  if(matchArray.length>1){const[row2,col2]=getCoordinates(matchArray[1]);if(col1===col2)specialType="vertical"}
  board[i]={type:board[i].type,special:specialType};matches.delete(i);
 }
 matches.forEach(index=>{const node=boardElement.children[index];if(node)node.classList.add("matched")});
 setTimeout(()=>{
  matches.forEach(index=>board[index]=null);
  applySpecialEffects();
  dropCandies();
  renderBoard();
  setTimeout(()=>{
   const next=findMatches();
   if(next.size>0)processMatches(next);else finishTurn();
  },200);
 },250);
}
function applySpecialEffects(){
 const affected=new Set();
 board.forEach((candy,index)=>{
  if(!candy)return;
  if(candy.special==="horizontal"){const[row]=getCoordinates(index);for(let col=0;col<COLS;col++)affected.add(getIndex(row,col))}
  else if(candy.special==="vertical"){const[,col]=getCoordinates(index);for(let row=0;row<ROWS;row++)affected.add(getIndex(row,col))}
 });
 affected.forEach(index=>board[index]=null);
}
function dropCandies(){
 for(let col=0;col<COLS;col++){
  let writeRow=ROWS-1;
  for(let row=ROWS-1;row>=0;row--){
   const index=getIndex(row,col);
   if(board[index]){board[getIndex(writeRow,col)]=board[index];if(writeRow!==row)board[index]=null;writeRow--}
  }
  for(let row=writeRow;row>=0;row--)board[getIndex(row,col)]=createCandy(randomCandyType());
 }
}
function finishTurn(){
 busy=false;
 if(score>=level*1000){level++;moves+=5;messageElement.textContent=`🎉 Level ${level}! +5 bonus moves!`}
 renderBoard();
 if(moves<=0)endGame();
}
function shuffleBoard(){
 if(busy||moves<=0)return;
 let attempts=0;
 do{board.forEach(c=>{c.type=randomCandyType();c.special=null});attempts++}while(findMatches().size>0&&attempts<100);
 messageElement.textContent="🔀 Board shuffled!";renderBoard();
}
function endGame(){
 busy=true;gameOverTitle.textContent="🍭 Game Over";gameOverText.textContent=`Final Score: ${score} • Level ${level}`;overlay.classList.add("show");
}
function restartGame(){
 score=0;moves=STARTING_MOVES;level=1;selectedCell=null;busy=false;overlay.classList.remove("show");messageElement.textContent="Swap two adjacent candies to start!";createBoard();renderBoard();
}
document.getElementById("restart").addEventListener("click",restartGame);
document.getElementById("overlayRestart").addEventListener("click",restartGame);
document.getElementById("shuffle").addEventListener("click",shuffleBoard);
boardElement.addEventListener("pointerdown",event=>{
 const candy=event.target.closest(".candy");if(candy)dragStart=Array.from(boardElement.children).indexOf(candy);
});
boardElement.addEventListener("pointerup",event=>{
 if(dragStart===null)return;
 const candy=event.target.closest(".candy");
 if(candy){
  const end=Array.from(boardElement.children).indexOf(candy);
  if(end>=0&&end!==dragStart){
   const[r1,c1]=getCoordinates(dragStart),[r2,c2]=getCoordinates(end);
   if(Math.abs(r1-r2)+Math.abs(c1-c2)===1&&!busy)performSwap(dragStart,end);
  }
 }
 dragStart=null;
});
restartGame();
})();
</script>
</body>
</html>
